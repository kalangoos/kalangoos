[workspace]
resolver = "2"
members = ["crates/kalangod", "crates/kalango-aprovacao", "crates/kalango-shell", "crates/kalango-movimento", "crates/kalango-i18n", "crates/kalango-agente", "crates/kalango-entrada", "crates/kalango-instalador"]
# a tela de aprovação e o shell precisam do GTK4 e do gtk4-layer-shell (poc/setup-deps.sh); o padrão compila só o kalangod
default-members = ["crates/kalangod", "crates/kalango-agente"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://kalangoos.com"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
