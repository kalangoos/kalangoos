[workspace]
resolver = "2"
members = ["crates/kalangod", "crates/kalango-tela", "crates/kalango-aprovacao", "crates/kalango-shell", "crates/kalango-movimento", "crates/kalango-i18n", "crates/kalango-agente", "crates/kalango-entrada", "crates/kalango-instalador", "crates/kalango-sons", "crates/kalango-modelos", "crates/kalango-d1"]
# a tela de aprovação e o shell precisam do GTK4 e do gtk4-layer-shell (poc/setup-deps.sh); o padrão compila só o kalangod
default-members = ["crates/kalangod", "crates/kalango-agente"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://kalangoos.com"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# the dev session (sessao/rodar.sh): optimised enough to feel like the real thing, but incremental and without LTO,
# so rebuilding the shell after a change takes seconds instead of minutes; images, the suite and measurements use release
[profile.sessao]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
strip = false
