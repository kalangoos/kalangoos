[package]
name = "kalango-entrada"
version = "0.1.1"
edition.workspace = true
publish = false
license.workspace = true
description = "KalangoOS · tela de entrada (greeter do greetd): escolher a pessoa, a senha e a sessão"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
gtk4-layer-shell = "0.5"
serde_json = "1"
kalango-movimento = { path = "../kalango-movimento" }
kalango-i18n = { path = "../kalango-i18n" }
# a wrong password's sound (the system's theme, played in this process)
kalango-sons = { path = "../kalango-sons" }
