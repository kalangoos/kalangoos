[package]
name = "kalango-instalador"
version = "0.1.1"
edition.workspace = true
publish = false
license.workspace = true
description = "KalangoOS · o instalador (boas-vindas, disco, conta, instalação) e o motor que instala"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kalango-movimento = { path = "../kalango-movimento" }
kalango-i18n = { path = "../kalango-i18n" }
kalango-modelos = { path = "../kalango-modelos" }
url = "2"

[dev-dependencies]
tempfile = "3"
