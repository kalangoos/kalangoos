[package]
name = "kalango-aprovacao"
version = "0.1.2"
edition.workspace = true
publish = false
license.workspace = true
description = "KalangoOS · tela de aprovação do sistema: mostra cada pedido de agente ao kalangod numa superfície do compositor que nenhum agente desenha"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
gtk4-layer-shell = "0.5"
serde_json = "1"
libc = "0.2"
kalango-movimento = { path = "../kalango-movimento" }
kalango-i18n = { path = "../kalango-i18n" }
kalango-d1 = { path = "../kalango-d1" }
