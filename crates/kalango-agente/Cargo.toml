[package]
name = "kalango-agente"
version = "0.1.2"
edition.workspace = true
publish = false
license.workspace = true
description = "KalangoOS agent engine: local model (llama.cpp + LFM3) acting on the system through kalangod"

[dependencies]
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
kalango-i18n = { path = "../kalango-i18n" }
kalango-d1 = { path = "../kalango-d1" }
base64 = "0.22"
unicode-normalization = "0.1"
libc = "0.2"
ring = "0.17"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
