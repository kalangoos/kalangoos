name: "Pacotes do sistema (apt)"
description: >-
  Installs system packages the fast way: the main Ubuntu archive first (the mirror the runner picks was seen serving
  20-340 kB/s, six minutes for 53 MB; archive.ubuntu.com served the same kind of files at tens of MB/s), no manual
  pages or documentation, no recommended packages, no fsync per file. One call per job: a single resolution and a
  single download phase for every package of the job.

inputs:
  pacotes:
    description: "Space-separated package names"
    required: true

runs:
  using: "composite"
  steps:
    - name: apt install
      shell: bash
      env:
        PACOTES: ${{ inputs.pacotes }}
      run: |
        set -euo pipefail
        # The runner's own mirror list stays as the fallback: apt's mirror method tries the next line when one fails.
        lista=/etc/apt/mirrors-kalango.txt
        { echo "http://archive.ubuntu.com/ubuntu/"; sed 's/[[:space:]].*//' /etc/apt/apt-mirrors.txt 2>/dev/null || true; } \
          | awk 'NF && !visto[$0]++' | sudo tee "$lista" >/dev/null
        for f in /etc/apt/sources.list.d/*.sources /etc/apt/sources.list; do
          [ -f "$f" ] && sudo sed -i "s#mirror+file:/etc/apt/apt-mirrors.txt#mirror+file:$lista#" "$f"
        done
        # CI never reads manuals, docs or info pages: not unpacking them (and not rebuilding the man-db index after every
        # install) is time saved on every package
        sudo rm -f /var/lib/man-db/auto-update
        printf 'path-exclude=/usr/share/doc/*\npath-exclude=/usr/share/man/*\npath-exclude=/usr/share/info/*\n' \
          | sudo tee /etc/dpkg/dpkg.cfg.d/90-kalango-ci >/dev/null
        sudo apt-get -o Acquire::Retries=3 update -q
        # (the word splitting of $PACOTES is the point)
        # shellcheck disable=SC2086
        sudo apt-get -o Acquire::Retries=3 -o Dpkg::Options::=--force-unsafe-io install -y -q --no-install-recommends $PACOTES
