name: Dependências

# Cargo.lock in sync with the manifests, and every crate within the licence list, from a known source and without
# a known advisory (deny.toml). Runs when the dependencies change, and weekly for new advisories.
on:
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/dependencias.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/dependencias.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencias-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_DENY_VERSION: "0.22.0"
  CARGO_DENY_SHA256: "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786"

jobs:
  lockfile:
    name: Cargo.lock em dia
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo metadata --locked
        # fails when a manifest changed without the lockfile (no build, no system libraries needed)
        run: cargo metadata --locked --format-version 1 > /dev/null

  deny:
    name: Licenças, fontes e alertas (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -o deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  deny.tar.gz" | sha256sum -c -
          tar xzf deny.tar.gz
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/${name}/cargo-deny" --locked check licenses bans sources advisories
