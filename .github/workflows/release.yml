name: Release

# Builds the KalangoOS binaries (the shell, kalangod, the agent engine, the approval, login and installer screens) as
# one tarball with checksums and a build provenance attestation, and opens a DRAFT release for a `v*` tag: a
# maintainer reads it and publishes it by hand. A weekly dry run on main finds release-only breakage early.
#
# The installable ISO (imagem/construir.sh) is built and tested in a VM on every run: the live session comes up with the
# installer, the installer really installs onto an empty virtual disk, and the installed system boots into its
# session. A tag attaches the tested ISO to the draft.
#
# The pieces of the ISO that do not depend on each other are built in jobs that run at the same time, and the ISO job only
# assembles them: the OS binaries (binarios), the kernel, niri, llama.cpp + Moli, Kalango Remote, Kalango Audio and the
# root filesystem of Ubuntu packages (rootfs). Each piece is cached by everything that changes its result (the key is
# written in its job), so a run that changes nothing in a piece reuses it. This workflow has no pull request trigger:
# it only runs on a tag, on the weekly schedule (main) and by hand, so no pull request can restore or write these caches.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão para um teste, por exemplo 0.1.0-dev.1 (vazio: a do Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # the native apps that live in their own repositories, at fixed commits (bump them here, in their own pull request)
  REMOTE_REF: e1795114c4c5cb4959731e0461e7adaf7daaad5a
  AUDIO_REF: 3e68e3437356086e2e108d3dded0ed9ddfc688c2

jobs:
  binarios:
    name: Binários (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versão
        id: versao
        env:
          INPUT: ${{ inputs.versao }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then v="${REF_NAME#v}"
          elif [ -n "$INPUT" ]; then v="$INPUT"
          else v="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/kalango-shell/Cargo.toml | head -1)-dev.$(git rev-parse --short HEAD)"
          fi
          [[ "$v" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "::error::versão inválida: $v"; exit 1; }
          echo "versao=$v" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/preparar
        with:
          cache-key: release
      - name: Compilar
        run: >-
          cargo build --release --locked
          -p kalango-shell -p kalangod -p kalango-agente -p kalango-aprovacao -p kalango-entrada -p kalango-instalador -p kalango-tela
      - name: Empacotar
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          set -euo pipefail
          name="kalangoos-${VERSAO}-linux-x86_64"
          out="$RUNNER_TEMP/$name"
          mkdir -p "$out/bin" "$out/lib" "$out/share"
          for b in kalango-shell kalangod kalango-agente kalango-aprovacao kalango-entrada kalango-instalador; do
            install -m 0755 "target/release/$b" "$out/bin/"
          done
          # gtk4-layer-shell has no Ubuntu 24.04 package: the library goes along (MIT)
          cp -a "$KALANGO_DEPS_PREFIX"/lib/libgtk4-layer-shell.so* "$out/lib/"
          cp -a sessao/dist "$out/share/sessao"
          cp -a crates/kalangod/dist "$out/share/kalangod"
          cp -a crates/kalango-aprovacao/dist "$out/share/kalango-aprovacao"
          cp README.md ROADMAP.md NOTICE ATTRIBUTION.md "$out/"
          for f in LICENSE LICENSE-*; do [ -f "$f" ] && cp "$f" "$out/"; done
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binarios
          path: dist/
          if-no-files-found: error
          retention-days: 14
      # the ISO job reuses these instead of compiling the same crates a second time (it adds kalango-tela, which the
      # tarball does not carry)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: os-binarios
          path: |
            target/release/kalango-shell
            target/release/kalangod
            target/release/kalango-agente
            target/release/kalango-aprovacao
            target/release/kalango-entrada
            target/release/kalango-instalador
            target/release/kalango-tela
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  kernel:
    name: Kernel do KalangoOS
    runs-on: ubuntu-24.04
    # a full build with debug info (BTF, for the eBPF rules) takes 2-3 h on a standard runner; the cache makes it rare
    timeout-minutes: 330
    outputs:
      chave: ${{ steps.chave.outputs.chave }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chave do cache
        id: chave
        run: echo "chave=kernel-${{ hashFiles('kernel/config-*', 'kernel/kalango.config', 'kernel/build.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Cache do kernel
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kernel/out/*.deb
          key: ${{ steps.chave.outputs.chave }}
      - name: Compilar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends \
            build-essential gawk flex bison bc dwarves dpkg-dev debhelper libelf-dev libssl-dev libdw-dev rsync zstd cpio kmod
          # the build tree with debug info needs tens of GB: the runner's second disk
          sudo mkdir -p /mnt/kernel-src && sudo chown "$USER" /mnt/kernel-src
          ln -s /mnt/kernel-src kernel/src
          v=$(find kernel -maxdepth 1 -name 'config-*' -printf '%f\n' | sed 's/^config-//' | sort -V | tail -1)
          KALANGO_KERNEL_SEM_DBG=1 kernel/build.sh "$v" || { tail -80 "kernel/out/build-$v.log"; exit 1; }
          rm -f kernel/out/linux-headers-*.deb kernel/out/linux-libc-dev_*.deb

  niri:
    name: Peça da imagem (niri)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      chave: ${{ steps.chave.outputs.chave }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # key: the script that pins the niri commit and builds it + the install of the build environment (the toolchain
      # version lives in the preparar action) + the month, so system library fixes are picked up at least monthly
      - name: Chave do cache
        id: chave
        env:
          HASH: ${{ hashFiles('imagem/dependencias.sh', '.github/actions/preparar/action.yml', '.github/actions/apt/action.yml') }}
        run: echo "chave=niri-${HASH}-$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache do niri
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            poc/.deps/src/niri/target/release/niri
            poc/.deps/src/niri/resources/niri-session
            poc/.deps/src/niri/resources/niri.service
            poc/.deps/src/niri/resources/niri-shutdown.target
            poc/.deps/root/usr/lib/x86_64-linux-gnu/libdisplay-info.so.1
          key: ${{ steps.chave.outputs.chave }}
      - uses: ./.github/actions/preparar
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          gtk: "false"
          cargo-cache: "false"
          pacotes-extras: libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libinput-dev libseat-dev libpipewire-0.3-dev libpango1.0-dev libdisplay-info-dev libdbus-1-dev libsystemd-dev
      - name: Compilar o niri
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          imagem/dependencias.sh niri
          # (the niri was linked against the Ubuntu 24.04 libdisplay-info.so.1: the image build copies it along)
          mkdir -p poc/.deps/root/usr/lib/x86_64-linux-gnu
          cp -L /usr/lib/x86_64-linux-gnu/libdisplay-info.so.1 poc/.deps/root/usr/lib/x86_64-linux-gnu/

  llama:
    name: Peça da imagem (llama.cpp e Moli)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      chave: ${{ steps.chave.outputs.chave }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chave do cache
        id: chave
        env:
          HASH: ${{ hashFiles('imagem/dependencias.sh', 'poc/setup-deps.sh', '.github/actions/apt/action.yml') }}
        run: echo "chave=llama-${HASH}-$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache do llama.cpp e do Moli
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            poc/.deps/src/llama.cpp/build-imagem/bin/llama-server
            poc/.deps/src/llama.cpp/build-imagem/bin/lib*.so*
            poc/.deps/moli
          key: ${{ steps.chave.outputs.chave }}
      - uses: ./.github/actions/apt
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          pacotes: build-essential pkg-config clang cmake libvulkan-dev
      - name: Compilar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # glslc and the SPIR-V headers (apt-get download, no sudo) and Moli; then llama.cpp itself
          KALANGO_SEM_LAYER_SHELL=1 KALANGO_DEPS="glslc spirv-headers" poc/setup-deps.sh
          imagem/dependencias.sh llama
      - name: Conferir (o Moli ausente não derruba a montagem da imagem, só a deixa sem ele)
        run: test -x poc/.deps/moli/moli && test -x poc/.deps/src/llama.cpp/build-imagem/bin/llama-server

  remote:
    name: Kalango Remote
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      chave: ${{ steps.chave.outputs.chave }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # key: the pinned commit + the build environment (toolchain and system libraries are defined in the two actions)
      - name: Chave do cache
        id: chave
        env:
          HASH: ${{ hashFiles('.github/actions/preparar/action.yml', '.github/actions/apt/action.yml') }}
        run: echo "chave=remote-${REMOTE_REF}-${HASH}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kalangoos/kalango-remote
          ref: ${{ env.REMOTE_REF }}
          path: apps/kalango-remote
          # (RustDesk's hbb_common is a submodule)
          submodules: true
          persist-credentials: false
      - name: Cache do Kalango Remote
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/kalango-remote/target/release/kalango-remote
            apps/kalango-remote/target/release/kalango-remote-core
            apps/kalango-remote/kalangoos/.deps/bin/cloudflared
            apps/kalango-remote/kalangoos/.deps/root/usr/lib/x86_64-linux-gnu/libvpx.so.9
          key: ${{ steps.chave.outputs.chave }}
      - uses: ./.github/actions/preparar
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          cargo-cache: "false"
          # the RustDesk core is GTK 3 (its process runs apart from the GTK 4 window)
          pacotes-extras: libgtk-3-dev
      - name: Cache do cargo (só a main grava)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/kalango-remote
          shared-key: remote
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compilar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # (no -u: env.sh is sourced)
          set -eo pipefail
          # the RustDesk core's codec libraries and cloudflared (pinned with its SHA-256), without sudo
          cd apps/kalango-remote
          kalangoos/scripts/deps.sh
          kalangoos/scripts/cloudflared.sh
          source kalangoos/scripts/env.sh
          cargo build --release --locked -p kalango-remote -p kalango-remote-core --features kalango-remote-core/linux-pkg-config
          # (libvpx.so.9 is a link into the extracted package: the cache keeps files, so keep the file itself)
          so=kalangoos/.deps/root/usr/lib/x86_64-linux-gnu/libvpx.so.9
          cp -L "$so" "$so.tmp" && mv -f "$so.tmp" "$so"

  audio:
    name: Kalango Audio
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      chave: ${{ steps.chave.outputs.chave }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chave do cache
        id: chave
        env:
          HASH: ${{ hashFiles('.github/actions/preparar/action.yml', '.github/actions/apt/action.yml') }}
        run: echo "chave=audio-${AUDIO_REF}-${HASH}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kalangoos/kalango-audio
          ref: ${{ env.AUDIO_REF }}
          path: apps/kalango-audio
          persist-credentials: false
      - name: Cache do Kalango Audio
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/kalango-audio/target/release/kalango-audio
          key: ${{ steps.chave.outputs.chave }}
      - uses: ./.github/actions/preparar
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          cargo-cache: "false"
      - name: Cache do cargo (só a main grava)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/kalango-audio
          shared-key: audio
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compilar
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked
        working-directory: apps/kalango-audio

  rootfs:
    name: Raiz de pacotes do Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      chave: ${{ steps.chave.outputs.chave }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # key: the package list and the script that holds the mmdebstrap options + the ISO week: the archive moves on (security
      # updates), so the packages are re-resolved at least weekly (the weekly run on main refreshes it)
      - name: Chave do cache
        id: chave
        env:
          HASH: ${{ hashFiles('imagem/pacotes.txt', 'imagem/construir.sh', '.github/actions/apt/action.yml') }}
        run: echo "chave=rootfs-${HASH}-$(date +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache da raiz
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rootfs/raiz.tar
          key: ${{ steps.chave.outputs.chave }}
      - uses: ./.github/actions/apt
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          pacotes: mmdebstrap
      - name: Montar a raiz
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          KALANGO_IMAGEM_ISO: "1"
          KALANGO_IMAGEM_TMP: /mnt/kalango/build
        run: |
          set -euo pipefail
          # mmdebstrap --mode=unshare builds the root without root: it needs subordinate ids for this user and user
          # namespaces, which Ubuntu 24.04 restricts through AppArmor
          grep -q "^$USER:" /etc/subuid || echo "$USER:100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$USER:" /etc/subgid || echo "$USER:100000:65536" | sudo tee -a /etc/subgid
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir -p /mnt/kalango && sudo chown "$USER" /mnt/kalango
          mkdir -p rootfs
          KALANGO_IMAGEM_BASE="$PWD/rootfs/raiz.tar" imagem/construir.sh base

  imagem:
    name: ISO (montar e instalar numa VM)
    needs: [binarios, kernel, niri, llama, remote, audio, rootfs]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Espaço em disco (apagando em segundo plano, enquanto o resto prepara)
        run: |
          # the image, its squashfs, the ISO and the test VM's disk need ~15 GB
          sudo mkdir -p /mnt/kalango && sudo chown "$USER" /mnt/kalango
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - uses: ./.github/actions/apt
        with:
          pacotes: >-
            mmdebstrap squashfs-tools fakeroot e2fsprogs xorriso mtools grub-pc-bin grub-efi-amd64-bin
            qemu-system-x86 qemu-utils ovmf python3
      - name: Usuário sem root, namespaces e KVM
        run: |
          set -euo pipefail
          grep -q "^$USER:" /etc/subuid || echo "$USER:100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$USER:" /etc/subgid || echo "$USER:100000:65536" | sudo tee -a /etc/subgid
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # the VM test: KVM for this user (the runner has the device, not the permission)
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # the native apps' repositories at the pinned commits (the cache below brings the compiled files; the icons and
      # launchers come from the source)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kalangoos/kalango-remote
          ref: ${{ env.REMOTE_REF }}
          path: apps/kalango-remote
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kalangoos/kalango-audio
          ref: ${{ env.AUDIO_REF }}
          path: apps/kalango-audio
          persist-credentials: false
      # every piece comes from the job that built it, by the exact key; a miss is an error, never a silent rebuild
      - name: Kernel (do cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kernel/out/*.deb
          key: ${{ needs.kernel.outputs.chave }}
          fail-on-cache-miss: true
      - name: Raiz de pacotes (do cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rootfs/raiz.tar
          key: ${{ needs.rootfs.outputs.chave }}
          fail-on-cache-miss: true
      - name: niri (do cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            poc/.deps/src/niri/target/release/niri
            poc/.deps/src/niri/resources/niri-session
            poc/.deps/src/niri/resources/niri.service
            poc/.deps/src/niri/resources/niri-shutdown.target
            poc/.deps/root/usr/lib/x86_64-linux-gnu/libdisplay-info.so.1
          key: ${{ needs.niri.outputs.chave }}
          fail-on-cache-miss: true
      - name: llama.cpp e Moli (do cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            poc/.deps/src/llama.cpp/build-imagem/bin/llama-server
            poc/.deps/src/llama.cpp/build-imagem/bin/lib*.so*
            poc/.deps/moli
          key: ${{ needs.llama.outputs.chave }}
          fail-on-cache-miss: true
      - name: Kalango Remote (do cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/kalango-remote/target/release/kalango-remote
            apps/kalango-remote/target/release/kalango-remote-core
            apps/kalango-remote/kalangoos/.deps/bin/cloudflared
            apps/kalango-remote/kalangoos/.deps/root/usr/lib/x86_64-linux-gnu/libvpx.so.9
          key: ${{ needs.remote.outputs.chave }}
          fail-on-cache-miss: true
      - name: Kalango Audio (do cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/kalango-audio/target/release/kalango-audio
          key: ${{ needs.audio.outputs.chave }}
          fail-on-cache-miss: true
      # the OS binaries of this very run (job binarios): the same crates, compiled once
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: os-binarios
          path: target/release
      - name: Conferir as peças
        run: |
          set -euo pipefail
          chmod +x target/release/kalango-* target/release/kalangod poc/.deps/src/niri/target/release/niri \
            poc/.deps/src/llama.cpp/build-imagem/bin/llama-server poc/.deps/moli/moli \
            apps/kalango-remote/target/release/kalango-remote apps/kalango-remote/target/release/kalango-remote-core \
            apps/kalango-remote/kalangoos/.deps/bin/cloudflared apps/kalango-audio/target/release/kalango-audio
          for f in target/release/kalango-shell target/release/kalangod target/release/kalango-agente target/release/kalango-aprovacao \
                   target/release/kalango-entrada target/release/kalango-instalador target/release/kalango-tela \
                   poc/.deps/src/niri/target/release/niri poc/.deps/moli/moli rootfs/raiz.tar \
                   apps/kalango-remote/kalangoos/.deps/root/usr/lib/x86_64-linux-gnu/libvpx.so.9; do
            [ -s "$f" ] || { echo "::error::falta $f"; exit 1; }
          done
          ls -l kernel/out/*.deb
          while pgrep -x rm > /dev/null; do sleep 2; done   # the disk cleanup started at the beginning
          df -h / /mnt
      - name: Montar a ISO
        env:
          KALANGO_REMOTE_DIR: ${{ github.workspace }}/apps/kalango-remote
          KALANGO_AUDIO_DIR: ${{ github.workspace }}/apps/kalango-audio
          KALANGO_IMAGEM_ISO: "1"
          KALANGO_IMAGEM_TMP: /mnt/kalango/build
          KALANGO_IMAGEM_BASE: ${{ github.workspace }}/rootfs/raiz.tar
          # no local model in the ISO the CI publishes (its licence is being reviewed): the agent gets it later
          KALANGO_MODELOS: /nenhum
        run: imagem/construir.sh
      - name: Testar a ISO (ao vivo, instalar, ligar o sistema instalado)
        run: imagem/testar-iso.sh instalar
      - name: Registros do teste
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teste-da-iso
          path: |
            target/iso/teste-*/console.log
            target/iso/teste-*/qemu-*.log
          retention-days: 7
      - name: ISO e somas
        env:
          VERSAO: ${{ needs.binarios.outputs.versao }}
        run: |
          set -euo pipefail
          mkdir -p dist-iso
          mv target/iso/kalangoos.iso "dist-iso/kalangoos-${VERSAO}-amd64.iso"
          (cd dist-iso && sha256sum ./*.iso > SHA256SUMS-iso.txt && cat SHA256SUMS-iso.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-iso
          path: dist-iso/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publicar:
    name: Rascunho da versão
    needs: [binarios, imagem]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binarios
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-iso
          path: dist
      - name: Atestado de origem do build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.iso
      - name: Rascunho no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSAO: ${{ needs.binarios.outputs.versao }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$VERSAO" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --draft $prerelease --verify-tag \
            --title "KalangoOS $VERSAO" \
            --notes "KalangoOS $VERSAO: a ISO para instalar (x86_64, UEFI; testada numa VM: sessão ao vivo, instalação e o primeiro boot do sistema instalado) e os binários. Em desenvolvimento: veja o README."
