name: Release

# Builds the KalangoOS binaries (the shell, kalangod, the agent engine, the approval, login and installer screens) as
# one tarball with checksums and a build provenance attestation, and opens a DRAFT release for a `v*` tag: a
# maintainer reads it and publishes it by hand. A weekly dry run on main finds release-only breakage early.
#
# The installable ISO (imagem/construir.sh) is built and tested in a VM on every run: the live session comes up with the
# installer, the installer really installs onto an empty virtual disk, and the installed system boots into its
# session. A tag attaches the tested ISO to the draft. The kernel is built in its own job and cached by its
# configuration (kernel/config-*), so most runs reuse it.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão para um teste, por exemplo 0.1.0-dev.1 (vazio: a do Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  binarios:
    name: Binários (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versão
        id: versao
        env:
          INPUT: ${{ inputs.versao }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then v="${REF_NAME#v}"
          elif [ -n "$INPUT" ]; then v="$INPUT"
          else v="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/kalango-shell/Cargo.toml | head -1)-dev.$(git rev-parse --short HEAD)"
          fi
          [[ "$v" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "::error::versão inválida: $v"; exit 1; }
          echo "versao=$v" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/preparar
        with:
          cache-key: release
      - name: Compilar
        run: >-
          cargo build --release --locked
          -p kalango-shell -p kalangod -p kalango-agente -p kalango-aprovacao -p kalango-entrada -p kalango-instalador -p kalango-tela
      - name: Empacotar
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          set -euo pipefail
          name="kalangoos-${VERSAO}-linux-x86_64"
          out="$RUNNER_TEMP/$name"
          mkdir -p "$out/bin" "$out/lib" "$out/share"
          for b in kalango-shell kalangod kalango-agente kalango-aprovacao kalango-entrada kalango-instalador; do
            install -m 0755 "target/release/$b" "$out/bin/"
          done
          # gtk4-layer-shell has no Ubuntu 24.04 package: the library goes along (MIT)
          cp -a "$KALANGO_DEPS_PREFIX"/lib/libgtk4-layer-shell.so* "$out/lib/"
          cp -a sessao/dist "$out/share/sessao"
          cp -a crates/kalangod/dist "$out/share/kalangod"
          cp -a crates/kalango-aprovacao/dist "$out/share/kalango-aprovacao"
          cp README.md ROADMAP.md NOTICE ATTRIBUTION.md "$out/"
          for f in LICENSE LICENSE-*; do [ -f "$f" ] && cp "$f" "$out/"; done
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binarios
          path: dist/
          if-no-files-found: error
          retention-days: 14

  kernel:
    name: Kernel do KalangoOS
    runs-on: ubuntu-24.04
    # a full build with debug info (BTF, for the eBPF rules) takes 2-3 h on a standard runner; the cache makes it rare
    timeout-minutes: 330
    outputs:
      chave: ${{ steps.chave.outputs.chave }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chave do cache
        id: chave
        run: echo "chave=kernel-${{ hashFiles('kernel/config-*', 'kernel/kalango.config', 'kernel/build.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Cache do kernel
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kernel/out/*.deb
          key: ${{ steps.chave.outputs.chave }}
      - name: Compilar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends \
            build-essential gawk flex bison bc dwarves dpkg-dev debhelper libelf-dev libssl-dev libdw-dev rsync zstd cpio kmod
          # the build tree with debug info needs tens of GB: the runner's second disk
          sudo mkdir -p /mnt/kernel-src && sudo chown "$USER" /mnt/kernel-src
          ln -s /mnt/kernel-src kernel/src
          v=$(find kernel -maxdepth 1 -name 'config-*' -printf '%f\n' | sed 's/^config-//' | sort -V | tail -1)
          KALANGO_KERNEL_SEM_DBG=1 kernel/build.sh "$v" || { tail -80 "kernel/out/build-$v.log"; exit 1; }
          rm -f kernel/out/linux-headers-*.deb kernel/out/linux-libc-dev_*.deb

  imagem:
    name: ISO (montar e instalar numa VM)
    needs: [binarios, kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Espaço em disco
        run: |
          # the image, its squashfs, the ISO and the test VM's disk need ~15 GB beside the cargo build
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/kalango && sudo chown "$USER" /mnt/kalango
          df -h / /mnt
      - name: Kernel (do cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kernel/out/*.deb
          key: ${{ needs.kernel.outputs.chave }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/preparar
        with:
          cache-key: imagem
      - name: Ferramentas da imagem
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends \
            mmdebstrap squashfs-tools fakeroot e2fsprogs xorriso mtools grub-pc-bin grub-efi-amd64-bin \
            qemu-system-x86 qemu-utils ovmf cmake libvulkan-dev \
            libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libinput-dev libseat-dev libpipewire-0.3-dev \
            libpango1.0-dev libdisplay-info-dev libdbus-1-dev libsystemd-dev
          # mmdebstrap --mode=unshare builds the image without root: it needs subordinate ids for this user and user
          # namespaces, which Ubuntu 24.04 restricts through AppArmor
          grep -q "^$USER:" /etc/subuid || echo "$USER:100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$USER:" /etc/subgid || echo "$USER:100000:65536" | sudo tee -a /etc/subgid
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # the VM test: KVM for this user (the runner has the device, not the permission)
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Peças da imagem (niri, llama.cpp, Moli)
        run: imagem/dependencias.sh
      - name: Binários
        run: >-
          cargo build --release --locked
          -p kalango-shell -p kalangod -p kalango-agente -p kalango-aprovacao -p kalango-entrada -p kalango-instalador -p kalango-tela
      # the native apps that live in their own repositories, at fixed commits (bump them here, in their own pull request)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kalangoos/kalango-remote
          ref: 2d962abdd7114a9fc4d65a9a1e7b868621b33cfc
          path: apps/kalango-remote
          # (RustDesk's hbb_common is a submodule)
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kalangoos/kalango-audio
          ref: ae5a1e712c3b8be1f029bd6494db33ff3f258dff
          path: apps/kalango-audio
          persist-credentials: false
      - name: Kalango Remote e Kalango Audio
        run: |
          set -euo pipefail
          # the RustDesk core is GTK 3 (its process runs apart from the GTK 4 window)
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends libgtk-3-dev
          # Remote: the RustDesk core's codec libraries and cloudflared (pinned with its SHA-256), without sudo
          (cd apps/kalango-remote && kalangoos/scripts/deps.sh && kalangoos/scripts/cloudflared.sh \
            && source kalangoos/scripts/env.sh \
            && cargo build --release --locked -p kalango-remote -p kalango-remote-core --features kalango-remote-core/linux-pkg-config)
          (cd apps/kalango-audio && cargo build --release --locked)
      - name: Montar a ISO
        env:
          KALANGO_REMOTE_DIR: ${{ github.workspace }}/apps/kalango-remote
          KALANGO_AUDIO_DIR: ${{ github.workspace }}/apps/kalango-audio
          KALANGO_IMAGEM_ISO: "1"
          KALANGO_IMAGEM_TMP: /mnt/kalango/build
          # no local model in the ISO the CI publishes (its licence is being reviewed): the agent gets it later
          KALANGO_MODELOS: /nenhum
        run: imagem/construir.sh
      - name: Testar a ISO (ao vivo, instalar, ligar o sistema instalado)
        run: imagem/testar-iso.sh instalar
      - name: Registros do teste
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teste-da-iso
          path: |
            target/iso/teste-*/console.log
            target/iso/teste-*/qemu-*.log
          retention-days: 7
      - name: ISO e somas
        env:
          VERSAO: ${{ needs.binarios.outputs.versao }}
        run: |
          set -euo pipefail
          mkdir -p dist-iso
          mv target/iso/kalangoos.iso "dist-iso/kalangoos-${VERSAO}-amd64.iso"
          (cd dist-iso && sha256sum ./*.iso > SHA256SUMS-iso.txt && cat SHA256SUMS-iso.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-iso
          path: dist-iso/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publicar:
    name: Rascunho da versão
    needs: [binarios, imagem]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binarios
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-iso
          path: dist
      - name: Atestado de origem do build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.iso
      - name: Rascunho no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSAO: ${{ needs.binarios.outputs.versao }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$VERSAO" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --draft $prerelease --verify-tag \
            --title "KalangoOS $VERSAO" \
            --notes "KalangoOS $VERSAO: a ISO para instalar (x86_64, UEFI; testada numa VM: sessão ao vivo, instalação e o primeiro boot do sistema instalado) e os binários. Em desenvolvimento: veja o README."
