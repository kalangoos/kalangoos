version: 2
# Paused (open-pull-requests-limit: 0) until the maintainers switch automatic pull requests on: Dependabot then
# only checks. Raise the limits to turn the weekly update pull requests on.
updates:
  # Rust crates: one grouped pull request a week (CI and cargo-deny check it)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    groups:
      crates:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 0

  # GitHub Actions: keeps the commit pins (and their version comments) current, in the workflows and the local action
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/preparar"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 0
