# KalangoOS: every app's "Abrir" and "Salvar" goes to the system's chooser (kalango-shell), and the permission
# requests (camera, microphone, location) to the system's dialog, and sharing the screen to the system's chooser
# (niri records it), and the apps' appearance (dark or light, the accent) follows the shell's theme — the other
# settings from GTK's; the rest to GTK's
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=kalango
org.freedesktop.impl.portal.Access=kalango
org.freedesktop.impl.portal.ScreenCast=kalango
org.freedesktop.impl.portal.Print=kalango
org.freedesktop.impl.portal.Settings=kalango;gtk
